server:
  port: 8080

spring:
  application:
    name: retainai-backend
  config:
    import:
      - optional:application-local.yml

  # --- Database (PostgreSQL / Neon) ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:${NEON_DB_URL:jdbc:postgresql://localhost:5432/retainai}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  # --- Spring AI — Google GenAI (Gemini Developer API) ---
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:your_gemini_api_key_here}
        project-id: ${GOOGLE_CLOUD_PROJECT:retainai-project}
        chat:
          thinking-level: MINIMAL
          options:
            model: gemini-3.6-flash
            temperature: 0.3

  # --- File upload limits ---
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# --- RetainAI Custom Config ---
retainai:
  gemini:
    api-key: ${GEMINI_API_KEY:your_gemini_api_key_here}
  jwt:
    secret: ${JWT_SECRET:retainai-dev-secret-key-minimum-256-bits-long-enough-for-hs256}
    expiration-ms: 86400000  # 24 hours
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 30
  cost:
    replacement-multiplier: ${COST_MULTIPLIER:1.5}

# --- Logging ---
logging:
  level:
    com.retainai: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
